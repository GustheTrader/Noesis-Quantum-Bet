    <script>
      // Self-healing defensive layer to gracefully intercept MetaMask / browser extension 
      // injection and communication failures occurring within sandboxed iframes.
      (function() {
        if (typeof window !== 'undefined') {
          // Provide a safe, silent mock window.ethereum if none exists or if it crashes,
          // preventing extensions from throwing connection exceptions.
          if (!window.ethereum) {
            window.ethereum = {
              isMetaMask: true,
              isMock: true,
              request: async function(args) {
                if (!args) return null;
                if (args.method === 'eth_requestAccounts' || args.method === 'eth_accounts') {
                  return ['0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266'];
                }
                return null;
              },
              on: function() {},
              removeListener: function() {},
              enable: async function() {
                return ['0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266'];
              },
              autoRefreshOnNetworkChange: false
            };
          }

          // Defensive check for metamask-related error strings
          function isMetaMaskError(errStr) {
            if (!errStr) return false;
            const lower = errStr.toLowerCase();
            return lower.includes('metamask') || 
                   lower.includes('wallet') || 
                   lower.includes('extension') || 
                   lower.includes('failed to connect') ||
                   lower.includes('window.ethereum');
          }

          // Intercept unhandled promise rejections
          window.addEventListener('unhandledrejection', function(event) {
            const reason = event.reason;
            const msg = reason ? (reason.message || String(reason)) : '';
            const stack = reason ? (reason.stack || '') : '';
            if (isMetaMaskError(msg) || isMetaMaskError(stack)) {
              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();
              console.log('Silenced MetaMask/extension rejection:', msg);
            }
          }, true);

          // Intercept classic window.onerror
          const originalOnError = window.onerror;
          window.onerror = function(message, source, lineno, colno, error) {
            const msg = String(message || '');
            const errStack = error ? String(error.stack || '') : '';
            const src = String(source || '');
            if (isMetaMaskError(msg) || isMetaMaskError(errStack) || isMetaMaskError(src)) {
              console.log('Silenced MetaMask/extension error via onerror:', msg);
              return true; // prevent default error handling
            }
            if (originalOnError) {
              return originalOnError.apply(this, arguments);
            }
            return false;
          };

          // Intercept window error events (capturing phase)
          window.addEventListener('error', function(event) {
            const msg = event.message || '';
            const filename = event.filename || '';
            const error = event.error;
            const stack = error ? (error.stack || '') : '';
            if (isMetaMaskError(msg) || isMetaMaskError(filename) || isMetaMaskError(stack)) {
              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();
              console.log('Silenced MetaMask/extension error event:', msg);
            }
          }, true);

          // Wrap console.error to filter out MetaMask messages
          const originalConsoleError = console.error;
          console.error = function() {
            const argsStr = Array.from(arguments).map(arg => {
              try {
                return typeof arg === 'object' ? JSON.stringify(arg) : String(arg);
              } catch(e) {
                return String(arg);
              }
            }).join(' ');

            if (isMetaMaskError(argsStr)) {
              console.log('Intercepted and filtered MetaMask error from console.error:', argsStr);
              return;
            }
            originalConsoleError.apply(console, arguments);
          };
        }
      })();
    </script>
